<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Shape Catcher — Дүрсний мөрдөгч</title>
  <!-- MediaPipe Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    body { font-family: sans-serif; background: #fdfbf7; margin: 0; padding: 20px; display: flex; gap: 20px; }
    #main { flex: 1; text-align: center; }
    #sidebar { width: 280px; background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .cam-box { position: relative; width: 100%; height: 200px; background: #000; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #fff; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    button { background: #ff9800; color: #fff; border: none; padding: 10px 15px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-bottom: 10px; width: 100%; }
    button:hover { background: #e68a00; }
  </style>
</head>
<body>

  <div id="main">
    <h2>🤖 AI Shape Catcher — Дүрсний мөрдөгч</h2>
    <p>🎯 Зөв дүрсийг гараараа бариад 🧺 сагс руу зөөгөөрэй!</p>
  </div>

  <div id="sidebar">
    <button id="camBtn">📷 Камер асаах</button>
    <div class="cam-box">
      <video id="webcam" autoplay playsinline></video>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const camBtn = document.getElementById('camBtn');

    camBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        videoElement.srcObject = stream;
        camBtn.innerText = "🟢 Камер ажиллаж байна";
        camBtn.style.background = "#4CAF50";
      } catch (err) {
        alert("Камер нээхэд алдаа гарлаа: " + err.message);
      }
    });
  </script>

</body>
</html>
